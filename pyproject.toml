[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma-tabular-lab"
version = "0.1.0"
description = "Compare Gemma numerical output heads with traditional price predictors"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<3",
  "scikit-learn>=1.6,<2",
  "xgboost>=3,<4",
]

[project.optional-dependencies]
gpu = [
  "torch>=2.10,<3",
  "transformers>=5.5,<6",
  "peft>=0.19,<1",
  "accelerate>=1.10,<2",
  "safetensors>=0.6,<1",
]
cloud = ["modal>=1.5,<2"]

[tool.setuptools.packages.find]
where = ["src"]
